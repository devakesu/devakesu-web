name: Secure Build & Deploy

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  merge_group:
    branches: ['main']
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Exact immutable image digest to deploy (e.g. sha256:...)'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Image tag to deploy if digest is unset (defaults to commit SHA)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 🔒 LOCK DOWN PERMISSIONS (Least Privilege)
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ------------------------------------------------------------------
  # JOB 1: GUARD (Runs on all PRs and pushes)
  # ------------------------------------------------------------------
  guard:
    name: 🛡️ Build Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # Allow cache restore without high-privilege write access
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Import GPG and SSH public keys
        run: |
          set -euo pipefail

          # Initialize gnupg and ssh directories with strict permissions
          mkdir -p -m 700 ~/.gnupg
          mkdir -p -m 700 ~/.ssh
          touch ~/.ssh/allowed_signers

          # Configure Git to recognize SSH allowed signers
          git config --global gpg.ssh.allowedSignersFile ~/.ssh/allowed_signers

          # Candidate accounts to fetch GPG & SSH public keys for
          CANDIDATES=(
            "${{ github.actor }}"
            "${{ github.repository_owner }}"
            "${{ github.event.pull_request.user.login || '' }}"
            "web-flow"
            "dependabot"
          )

          for user in "${CANDIDATES[@]}"; do
            # Sanitize username (e.g., strip bot suffixes and whitespace)
            clean_user=$(echo "$user" | sed -E 's/\[bot\]//g' | tr -d '[:space:]')
            if [ -n "$clean_user" ]; then
              echo "Importing GPG key for: $clean_user"
              curl -fsSL --retry 3 --retry-connrefused --max-time 10 \
                "https://github.com/${clean_user}.gpg" 2>/dev/null | gpg --batch --import 2>/dev/null || true

              echo "Importing SSH keys for: $clean_user"
              curl -fsSL --retry 3 --retry-connrefused --max-time 10 \
                "https://github.com/${clean_user}.keys" 2>/dev/null | while IFS= read -r key || [ -n "$key" ]; do
                  if [[ "$key" =~ ^(ssh-|ecdsa-|sk-) ]]; then
                    echo "* $key" >> ~/.ssh/allowed_signers
                  fi
                done || true
            fi
          done

          # Deduplicate allowed signers
          if [ -f ~/.ssh/allowed_signers ]; then
            sort -u ~/.ssh/allowed_signers -o ~/.ssh/allowed_signers
          fi

          # If the commit signature contains a GPG Key ID not yet in the keyring, attempt public keyserver lookup
          KEY_ID=$(git log -1 --format='%GK' 2>/dev/null || true)
          if [ -n "$KEY_ID" ]; then
            echo "Attempting keyserver lookup for commit Key ID: $KEY_ID"
            gpg --batch --keyserver keyserver.ubuntu.com --recv-keys "$KEY_ID" 2>/dev/null || \
            gpg --batch --keyserver keys.openpgp.org --recv-keys "$KEY_ID" 2>/dev/null || true
          fi

      - name: Verify commit is signed
        run: |
          set -euo pipefail

          # Determine commits to verify
          if [ "${{ github.event_name }}" = "pull_request" ] && git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            COMMITS=$(git rev-list "origin/${{ github.base_ref }}..HEAD")
            if [ -z "$COMMITS" ]; then
              COMMITS=$(git rev-parse HEAD)
            fi
          else
            COMMITS=$(git rev-parse HEAD)
          fi

          echo "========================================================"
          echo "Verifying signature(s) for commit(s):"
          echo "$COMMITS"
          echo "========================================================"

          FAILED=0
          for COMMIT_SHA in $COMMITS; do
            echo "--------------------------------------------------------"
            echo "Checking commit: $COMMIT_SHA"
            git log -1 --show-signature "$COMMIT_SHA" || true

            SIG_STATUS=$(git log -1 --format='%G?' "$COMMIT_SHA")
            SIGNER=$(git log -1 --format='%GS' "$COMMIT_SHA" 2>/dev/null || echo "Unknown")
            KEY_ID=$(git log -1 --format='%GK' "$COMMIT_SHA" 2>/dev/null || echo "Unknown")
            FINGERPRINT=$(git log -1 --format='%GF' "$COMMIT_SHA" 2>/dev/null || echo "Unknown")

            case "$SIG_STATUS" in
              G|U)
                echo "✓ Commit $COMMIT_SHA signature verified successfully."
                echo "  Signature Status : $SIG_STATUS (G=Good, U=Good with untrusted/imported key)"
                echo "  Signer           : $SIGNER"
                echo "  Key / ID         : $KEY_ID"
                echo "  Fingerprint      : $FINGERPRINT"
                ;;
              B)
                echo "::error::Commit $COMMIT_SHA has a BAD / CORRUPTED signature (Status: 'B')."
                FAILED=1
                ;;
              E)
                echo "::error::Commit $COMMIT_SHA signature cannot be checked - missing public key or GPG/SSH error (Status: 'E', Key ID: '$KEY_ID'). Please ensure your GPG or SSH signing key is added to your GitHub account."
                FAILED=1
                ;;
              N)
                echo "::error::Commit $COMMIT_SHA is NOT signed (Status: 'N'). All commits to protected branches must be signed with a valid GPG or SSH key."
                FAILED=1
                ;;
              X)
                echo "::error::Commit $COMMIT_SHA signature was made by an EXPIRED key (Status: 'X', Key ID: '$KEY_ID')."
                FAILED=1
                ;;
              Y)
                echo "::error::Commit $COMMIT_SHA signature itself has EXPIRED (Status: 'Y', Key ID: '$KEY_ID')."
                FAILED=1
                ;;
              R)
                echo "::error::Commit $COMMIT_SHA signature was made by a REVOKED key (Status: 'R', Key ID: '$KEY_ID')."
                FAILED=1
                ;;
              *)
                echo "::error::Commit $COMMIT_SHA is not signed with a valid key (Status: '$SIG_STATUS', Key ID: '$KEY_ID')."
                FAILED=1
                ;;
            esac
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more commits failed signature verification."
            exit 1
          fi
          echo "========================================================"
          echo "✓ All checked commit signatures verified successfully."
          echo "========================================================"

      - name: Validate Dependabot config
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir check-jsonschema
          check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json .github/dependabot.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build check
        run: npm run build

  # ------------------------------------------------------------------
  # JOB 2: LIGHTHOUSE CI (Performance + Accessibility)
  # ------------------------------------------------------------------
  lighthouse:
    needs: guard
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI (desktop)
        uses: treosh/lighthouse-ci-action@fcd65974f7c4c2bf0ee9d09b84d2489183c29726 # v12.6.1
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-desktop

      - name: Run Lighthouse CI (mobile)
        uses: treosh/lighthouse-ci-action@fcd65974f7c4c2bf0ee9d09b84d2489183c29726 # v12.6.1
        with:
          configPath: ./lighthouserc.mobile.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-mobile

  # ------------------------------------------------------------------
  # JOB 3: BUILD, PUSH & SIGN DOCKER IMAGE
  # ------------------------------------------------------------------
  build-push-sign:
    name: 🏗️ Build, Push & Sign
    needs: [guard, lighthouse]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write # Required for Sigstore signing
      packages: write # Required for GHCR push
      attestations: write # Required for GitHub attestations
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
      image_name: ${{ steps.prep.outputs.image_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: prep
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "created=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "started_on=$TIMESTAMP" >> "$GITHUB_OUTPUT"

          # Deterministic SOURCE_DATE_EPOCH from commit timestamp
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "source_date_epoch=${SOURCE_DATE_EPOCH}" >> "$GITHUB_OUTPUT"
          echo "🕒 SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}"

          IMAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.prep.outputs.source_date_epoch }}
            AUDIT_STATUS=PASSED (Trivy)
            SIGNATURE_STATUS=SLSA_PROVENANCE_GENERATED
            NEXT_PUBLIC_SITE_URL=https://devakesu.com
            NEXT_PUBLIC_ANALYTICS_ENABLED=true
            BUILD_ID=${{ github.run_number }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_RUN_ID=${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}

      # Attest build provenance
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Download SLSA provenance attestation for artifact archiving
      - name: Download SLSA provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Downloading SLSA Provenance Attestation ==="

          MAX_ATTEMPTS=5
          ATTEMPT=1
          SLEEP_TIME=10

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if gh attestation download \
              oci://ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }} \
              --owner ${{ github.repository_owner }}; then
              shopt -s nullglob
              digest_files=(sha256*.jsonl)
              if [ ${#digest_files[@]} -gt 0 ]; then
                DIGEST_FILE="${digest_files[0]}"
              else
                DIGEST_FILE=""
              fi
              if [ -n "$DIGEST_FILE" ]; then
                mv "$DIGEST_FILE" provenance.intoto.jsonl
                echo "✓ SLSA provenance attestation downloaded successfully"
                ls -lh provenance.intoto.jsonl
                exit 0
              else
                echo "⚠ Could not find downloaded attestation file"
                sleep $SLEEP_TIME
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
            else
              echo "⚠ Download failed, waiting ${SLEEP_TIME}s before retry..."
              sleep $SLEEP_TIME
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          echo "❌ Failed to download attestation after $MAX_ATTEMPTS attempts"
          exit 1

      # Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.json

      # Attest SBOM
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: sbom.json
          push-to-registry: true

      # Install cosign
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Authenticate cosign with registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          echo "${GH_TOKEN}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign web image (keyless)
        env:
          COSIGN_YES: 'true'
          IMAGE_URI: ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail

          echo "=== Cosign Web Image Signing ==="
          echo "Signing Web Image: ${IMAGE_URI}"
          timeout 300 cosign sign \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.ref }}" \
            -a "commit=${{ github.sha }}" \
            "${IMAGE_URI}" || {
              echo "ERROR: Cosign web image signing failed or timed out"
              exit 1
            }

          echo "✓ Web container image signed successfully"
          cosign triangulate "${IMAGE_URI}"

      - name: Verify web image signature
        env:
          IMAGE_URI: ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail

          echo "Verifying web image signature..."
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

          echo "✓ Web container image signature verified"

      # Sign Web SBOM file
      - name: Sign Web SBOM artifact
        run: |
          set -euo pipefail

          echo "=== Signing Web SBOM ==="
          timeout 60 cosign sign-blob --yes \
            --bundle sbom.json.bundle \
            sbom.json || {
              echo "ERROR: Web SBOM signing failed or timed out"
              exit 1
            }

          echo "✓ Web SBOM signed successfully"

      # Generate SHA256 checksums
      - name: Generate web checksums
        run: |
          echo "# Web Release Artifact Checksums" > web-checksums.txt
          echo "" >> web-checksums.txt
          echo "## Web SBOM" >> web-checksums.txt
          sha256sum sbom.json >> web-checksums.txt
          echo "" >> web-checksums.txt
          echo "## Web Signature Bundle" >> web-checksums.txt
          sha256sum sbom.json.bundle >> web-checksums.txt
          echo "" >> web-checksums.txt
          echo "## SLSA Provenance Attestation" >> web-checksums.txt
          sha256sum provenance.intoto.jsonl >> web-checksums.txt
          echo "" >> web-checksums.txt
          echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> web-checksums.txt
          echo "" >> web-checksums.txt
          cat web-checksums.txt

      # Upload artifacts
      - name: Upload web release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-release-artifacts
          path: |
            sbom.json
            sbom.json.bundle
            web-checksums.txt
            provenance.intoto.jsonl

  # ------------------------------------------------------------------
  # JOB 4: DEPLOY
  # ------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Coolify
    needs: build-push-sign
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Trigger Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_APP_ID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          INPUT_DIGEST: ${{ github.event.inputs.image_digest || '' }}
          INPUT_TAG: ${{ github.event.inputs.image_tag || '' }}
          BUILD_DIGEST: ${{ needs.build-push-sign.outputs.digest }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          set +x

          # Validate required Coolify configuration
          : "${COOLIFY_BASE_URL:?COOLIFY_BASE_URL secret is required}"
          : "${COOLIFY_APP_ID:?COOLIFY_APP_ID secret is required}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN secret is required}"

          [ -n "$COOLIFY_API_TOKEN" ] && echo "::add-mask::$COOLIFY_API_TOKEN"
          [ -n "$COOLIFY_BASE_URL" ] && echo "::add-mask::$COOLIFY_BASE_URL"
          [ -n "$COOLIFY_APP_ID" ] && echo "::add-mask::$COOLIFY_APP_ID"

          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          REPO_OWNER_LOWER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/${REPO_OWNER_LOWER}/${REPO_NAME}"

          # Determine target reference (immutable digest or commit SHA tag)
          if [ -n "${INPUT_DIGEST:-}" ]; then
            TARGET_REF="${INPUT_DIGEST}"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TARGET_REF="${INPUT_TAG}"
          else
            TARGET_REF="${{ github.sha }}"
          fi

          echo "Updating Coolify application (${COOLIFY_APP_ID}) to image: ${IMAGE_REPO}:${TARGET_REF}"

          # 1. Update application image reference to the exact repository and immutable tag/digest
          curl --fail-with-body --silent --show-error -X PATCH \
            "${COOLIFY_BASE_URL}/api/v1/applications/${COOLIFY_APP_ID}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\": \"${IMAGE_REPO}\", \"docker_registry_image_tag\": \"${TARGET_REF}\"}"

          echo "✓ Coolify application image reference updated"

          # 2. Trigger deployment
          curl --fail-with-body --silent --show-error -X POST \
            "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_APP_ID}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"

          echo "✓ Deployment triggered successfully"
